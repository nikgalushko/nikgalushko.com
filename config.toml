baseURL = "https://nikgalushko.com/"
languageCode = "ru-ru"
defaultContentLanguage = "ru"
author = "Nikita Galushko"
title = "Это мой чулан 👨‍💻"
theme = "smol"
[pagination]
pagerSize = 5
enableRobotsTXT = true

pygmentscodefences = true
pygmentscodefencesguesssyntax = true

googleAnalytics = "UA-185462416-1"
enableEmoji = true
[taxonomies]
	tag = "tags"
	category = "categories"
	series = "series"

[params]
	# Use homepage.md instead of a list of posts
	homepage = false

	# Add meta keywords in head part (Site Keywords or Tags of Page)
	keywords = ["golang","it","программирование","архитектура","go","разработка"]

	# Add meta description in head part
	description = "Блог про программировани, golang и архитектуре"

	# Add pagetitle to homepage <title> tag
	pagetitle = "Про Go и всякое из мира IT"

	# Add a subtitle to your website
	subtitle = "Про Go и всякое из мира IT"

	# Activate to show authors on pages if available
	#listAuthor = true

	# Add math typesetting with KaTeX (Global with this Param)
	math = true

	# Optional 80x80 avatar image.
	avatar = "/img/me.jpg"
	customCSS = ["css/x.css"]

	# Optional favicons for website
	#favicon = true

	# Add list of sections that should show up on the homepage
	mainSections = ["post"]

	# Add list of Sections/Types that should no be considered by RSS
	#nofeedSections = ["post"]

	# Deactivate Taxonomies for specific page types
	#disableTaxoTypes = [""]

	# Custom CSS applied to default styles. (Path could be "static/css/")
	#customCSS = "css/custom.css"
[markup.goldmark.renderer]
      unsafe = true

[menu]
	[[menu.main]]
	name = "Все посты"
	url = "/post"
	weight = 1

	[[menu.main]]
	name = "Обо мне"
	url = "/about"
	weight = 2

	[[menu.main]]
	name = "Теги"
	url = "/tags"
	weight = 3

	[[menu.main]]
	name = "Категории"
	url = "/categories"
	weight = 4

	[[menu.main]]
	name = "Треды"
	url = "/x"
	weight = 5

	[[menu.footer]]
	  name = "Github"
			url = "https://github.com/nikgalushko"
			weight = 1 

 [[menu.footer]]
	  name = "Twitter"
			url = "https://twitter.com/nikgalushko"
			weight = 2 

	[[menu.footer]]
	  name = "Telegram"
			url = "https://t.me/nikgalushko"
			weight = 3 